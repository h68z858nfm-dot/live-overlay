<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay Container (1080x1920)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0) !important;
            overflow: hidden;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kanvas Utama 1080x1920 Pixels */
        .overlay-canvas {
            position: relative;
            width: 1080px;
            height: 1920px;
            background: transparent;
            overflow: hidden;
        }

        /* Iframe styling dasar */
        .overlay-iframe {
            position: absolute;
            border: none;
            background: transparent !important;
            overflow: hidden;
            pointer-events: auto;
        }

        /* LINK 1: Alert (Top Left) */
        #iframe-link-1 {
            top: 20px;
            left: 20px;
            width: 500px;
            height: 350px;
            z-index: 10;
        }

        /* LINK 2: Mediashare (Top Right) */
        #iframe-link-2 {
            top: 20px;
            right: 20px;
            width: 500px;
            height: 350px;
            z-index: 10;
        }

        /* LINK 3: Milestone (Posisi diturunkan agar TIDAK mepet ke atas) */
        #iframe-link-3 {
            top: 410px; /* Diturunkan lebih ke bawah tepat di atas area gameplay */
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 120px;
            z-index: 10;
        }

        /* Area Tengah: Screen Capture Landscape (Game Area) */
        .gameplay-area-guide {
            position: absolute;
            top: 540px;
            left: 0;
            width: 1080px;
            height: 607px; /* Aspect Ratio 16:9 Landscape */
            pointer-events: none;
            background: transparent;
        }

        /* LINK 4: Top 10 Running Text (Tepat di bawah Screen capture Landscape) */
        #iframe-link-4 {
            top: 1155px;
            left: 0;
            width: 1080px;
            height: 80px;
            z-index: 10;
        }

        /* LINK 5: Top Like (Bottom Right - Upper) */
        #iframe-link-5 {
            top: 1255px;
            right: 20px;
            width: 480px;
            height: 310px;
            z-index: 10;
        }

        /* LINK 6: Top Gift (Bottom Right - Lower) */
        #iframe-link-6 {
            top: 1580px;
            right: 20px;
            width: 480px;
            height: 310px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="overlay-canvas">

        <!-- LINK 1: Alert -->
        <iframe 
            id="iframe-link-1" 
            class="overlay-iframe"
            src="https://sociabuzz.com/pro/tribe/alert1/v3/4342997870?colorName=%23ffffff&alphaName=1&colorNote=%23ffff00&alphaNote=1&colorFrom=%23b4a7d6&alphaFrom=1&gifActive=1&maxDuration=10&font=Open%2BSans%3A800" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

        <!-- LINK 2: Mediashare -->
        <iframe 
            id="iframe-link-2" 
            class="overlay-iframe"
            src="https://sociabuzz.com/pro/tribe/mediashare/v2/4342997870?colorName=%2300ff00&alphaName=1&colorNote=%23ffff00&alphaNote=1&colorFrom=%23eeeeee&alphaFrom=1&mediashareActive=1&mediashareTTS=1&font=Open%2BSans%3A800&mediashareNSFW=0" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

        <!-- LINK 3: Milestone (Diturunkan) -->
        <iframe 
            id="iframe-link-3" 
            class="overlay-iframe"
            src="https://sociabuzz.com/pro/tribe/total1/v1/4342997870" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

        <!-- Transparan Area untuk Screen Capture Landscape Game -->
        <div class="gameplay-area-guide"></div>

        <!-- LINK 4: Top 10 Running Text -->
        <iframe 
            id="iframe-link-4" 
            class="overlay-iframe"
            src="https://sociabuzz.com/pro/tribe/toprunningtext/v2/4342997870" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

        <!-- LINK 5: Top Like -->
        <iframe 
            id="iframe-link-5" 
            class="overlay-iframe"
            src="https://widgets.tikfinity.com/jRzLJxKXeJ" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

        <!-- LINK 6: Top Gift -->
        <iframe 
            id="iframe-link-6" 
            class="overlay-iframe"
            src="https://widgets.tikfinity.com/80gnPUIdfX" 
            allowtransparency="true" 
            scrolling="no">
        </iframe>

    </div>
</body>
</html>
